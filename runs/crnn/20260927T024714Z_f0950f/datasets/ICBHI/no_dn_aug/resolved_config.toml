protocol = "holdout_cv_v3"

[model]
architecture = "crnn"
reference_cnn_config = "cnn_v3.toml"

[crnn]
in_channels = 1
channels = [32, 64, 128, 128]
pool_sizes = [[2, 2], [2, 2], [2, 1], [2, 1]]
projection_dim = 128
gru_hidden = 128
gru_layers = 2
gru_dropout = 0.2
attention_dim = 64
head_hidden = 128
expected_parameters = 1192482

[acoustic]
sample_rate = 4000
segment_length = 20000
n_fft = 256
win_length = 256
hop_length = 64
center = false
window = "hann"
band_low_hz = 50
band_high_hz = 1800
expected_frames = 309

[logmel]
n_mels = 64
power = 2
fmin = 50
fmax = 1800
htk = false
norm = "slaney"
ref = 1.0
amin = 1e-10
top_db = 80

[weights]
normalize_to_mean_one = true

[normalization]
axis = "mel_band"
weighted = true
std_floor = 1e-06

[training]
optimizer = "adamw"
weight_decay = 0.0001
batch_size = 32
eval_batch_size = 256
max_epochs = 150
min_epochs = 20
patience = 15
grad_clip_norm = 1.0
scheduler = "cosine"
t_max = 150
eta_min = 1e-06
amp = true

[search]
mode = "random_without_replacement"
n_configurations = 20
random_state = 20260914
learning_rate = [0.0001, 0.0003, 0.001]
dropout = [0.2, 0.3, 0.4, 0.5]
weight_decay = [1e-05, 0.0001, 0.001]
batch_size = [16, 32, 64]

[selection]
criteria = ["balanced_accuracy_mean", "macro_f1_mean", "min_class_recall_mean", "balanced_accuracy_std", "config_order"]

[metrics]
primary = "balanced_accuracy"
descriptive = ["accuracy"]
reported = ["accuracy", "balanced_accuracy", "recall_copd", "recall_negative", "macro_f1", "auroc", "auprc_copd", "confusion_matrix", "roc_curve", "pr_curve"]
aggregation = ["fold_mean", "fold_std", "pooled"]

[evaluation]
decision_threshold = 0.5

[augmentation]
time_mask_max_frames = 20
time_mask_probability = 0.5
freq_mask_max_bands = 6
freq_mask_probability = 0.5
fill_value = 0.0

[seeds]
base = 20260914

[determinism]
cudnn_deterministic = true
deterministic_algorithms = true
warn_only = true

[figures]
dpi = 300
formats = ["png", "pdf"]

[paths]
default_data_root = "preprocessing/data/holdout_calibrated"
default_runs_root = "modeling/runs/holdout_final"
default_cache_root = "modeling/cache/logmel_holdout"

[holdout]
split_csv = "modeling/data/holdout_splits.csv"
split_manifest = "modeling/data/holdout_splits_manifest.json"
n_splits = 5
random_state = 20260914

[outer_test]
enabled = false

[final_model]
enabled = false

[datasets]
[datasets.ICBHI]
positive_diagnosis = "COPD"
negative_diagnosis = "Healthy"
negative_label_name = "Healthy"

[datasets.FRAIWAN_Extended]
positive_diagnosis = "COPD"
negative_diagnosis = "Normal"
negative_label_name = "Normal"

[experiments]
[experiments.main]
description = "Condicion principal: sin denoising."

[experiments.main.ICBHI]
condition = "no_dn"
branch = "no_dn"
dn_reliable_only = false

[experiments.main.FRAIWAN_Extended]
condition = "no_dn"
branch = "no_dn"
dn_reliable_only = false

[experiments.denoising_ablation]
description = "Comparacion emparejada no_dn vs dn, mismos folds internos."

[[experiments.denoising_ablation.ICBHI]]
condition = "no_dn"
branch = "no_dn"
dn_reliable_only = false
reused_from_main = true

[[experiments.denoising_ablation.ICBHI]]
condition = "dn"
branch = "dn"
dn_reliable_only = false

[[experiments.denoising_ablation.FRAIWAN_Extended]]
condition = "no_dn"
branch = "no_dn"
dn_reliable_only = false
reused_from_main = true

[[experiments.denoising_ablation.FRAIWAN_Extended]]
condition = "dn"
branch = "dn"
dn_reliable_only = false

[experiments.augmentation_ablation]
description = "Comparacion emparejada no_dn vs no_dn_aug, mismos pacientes y folds internos."

[[experiments.augmentation_ablation.ICBHI]]
condition = "no_dn"
branch = "no_dn"
dn_reliable_only = false
reused_from_main = true

[[experiments.augmentation_ablation.ICBHI]]
condition = "no_dn_aug"
branch = "no_dn"
dn_reliable_only = false
augment = true
hyperparameters_from = "no_dn"

[[experiments.augmentation_ablation.FRAIWAN_Extended]]
condition = "no_dn"
branch = "no_dn"
dn_reliable_only = false
reused_from_main = true

[[experiments.augmentation_ablation.FRAIWAN_Extended]]
condition = "no_dn_aug"
branch = "no_dn"
dn_reliable_only = false
augment = true
hyperparameters_from = "no_dn"

[condition_run]
model = "crnn"
dataset = "ICBHI"
condition = "no_dn_aug"
branch = "no_dn"
augment = true
hyperparameters_from = "no_dn"

