protocol = "icbhi_robustness_v1"
dataset = "ICBHI"
n_splits = 5
repetition_seeds = [20261001, 20261017, 20261103, 20261119, 20261205]
stratification = "target_label+collapsed_device_signature"

[paths]
original_split_csv = "modeling/data/holdout_splits.csv"
original_split_manifest = "modeling/data/holdout_splits_manifest.json"
cnn_config = "modeling/configs/holdout_final/cnn_v3.toml"
crnn_config = "modeling/configs/holdout_final/crnn_v3.toml"

[evaluation]
decision_threshold = 0.5
negative_label_name = "Healthy"

[device_baseline]
