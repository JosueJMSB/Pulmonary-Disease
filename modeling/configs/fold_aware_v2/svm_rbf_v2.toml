# Configuracion versionada del experimento SVM-RBF sobre el protocolo
# fold-aware (v2): el denoising y TARGET_RMS se recalibran por fold, usando
# solo los pacientes de train de ese fold (ver preprocessing/fold_denoising.py
# y modeling/build_master_folds.py). calibration_patient deja de reservar un
# grupo especial: todos los pacientes rotan por test/validation igual.
#
# Copia exacta de svm_rbf.toml en representacion acustica, hiperparametros y
# semillas. Cambia: [paths] (apunta a preprocessing/data/fold_calibrated),
# [folds] (nuevo, activa este protocolo), [final_model] (nuevo, sin modelo
# definitivo), [datasets]/[experiments] (condiciones no_dn/dn, sin
# no_dn_reliable/dn_reliable). No hay [splits]: el numero de folds y la
# semilla ya no se leen de aqui, sino de modeling/data/patient_folds_manifest.json
# (ver [folds] mas abajo).

[acoustic]
sample_rate = 4000
segment_length = 20000
n_fft = 256
win_length = 256
hop_length = 64
center = false
window = "hann"
band_low_hz = 50
band_high_hz = 1800
# 1 + (segment_length - n_fft) // hop_length con center=False.
expected_frames = 309

[logmel]
n_mels = 64
power = 2
fmin = 50
fmax = 1800
htk = false
norm = "slaney"
ref = 1.0
amin = 1e-10
top_db = 80

[mfcc]
n_mfcc = 13
delta_width = 9
delta_order = 1
delta2_order = 2

[summary]
statistics = ["mean", "std", "p10", "p90"]
percentiles = [10, 90]

[weights]
normalize_to_mean_one = true

[svm]
kernel = "rbf"
shrinking = true
tol = 1e-3
cache_size_mb = 1024
class_weight = "none"
c_grid = [0.1, 1, 10, 100]
gamma_grid = ["scale", 0.001, 0.01, 0.1]
decision_threshold = 0.0

[selection]
criteria = [
    "balanced_accuracy",
    "macro_f1",
    "min_class_recall",
    "neg_C",
    "gamma_order",
]

[bootstrap]
n_resamples = 2000
confidence = 0.95
random_state = 20260914

[figures]
dpi = 300
formats = ["png", "pdf"]

[paths]
# Salida de preprocessing/fold_denoising.py: <dataset>/fold_00..fold_04/.
default_data_root = "preprocessing/data/fold_calibrated"
default_runs_root = "modeling/runs/svm"
default_cache_root = "modeling/cache/features"

# ---------------------------------------------------------------------------
# Protocolo fold-aware: la asignacion maestra de folds vive fuera de este
# TOML (es la misma para SVM/CNN/CRNN y para no_dn/dn/no_dn_aug). Su
# presencia es lo que activa este protocolo en run_experiment.py/cnn_experiment.py.
# ---------------------------------------------------------------------------

[folds]
patient_folds_csv = "modeling/data/patient_folds.csv"
patient_folds_manifest = "modeling/data/patient_folds_manifest.json"

[final_model]
# Este protocolo no entrena modelo definitivo: no hay una unica cache de
# todos los pacientes (cada fold recalibro su propio denoising). Explicito
# (no un valor por defecto) para que quede documentado y forme parte de la
# huella de la ejecucion.
enabled = false

[datasets.ICBHI]
positive_diagnosis = "COPD"
negative_diagnosis = "Healthy"
negative_label_name = "Healthy"

[datasets.FRAIWAN_Extended]
positive_diagnosis = "COPD"
negative_diagnosis = "Normal"
negative_label_name = "Normal"

# ---------------------------------------------------------------------------
# Condiciones: no_dn (sin denoising) y dn (con denoising recalibrado por
# fold). Sin no_dn_reliable/dn_reliable: dn_reliable_only=false siempre -el
# denoising ya no filtra grabaciones, solo se documenta como descriptivo.
# ---------------------------------------------------------------------------

[experiments.main]
description = "Condicion principal: sin denoising."

[experiments.main.ICBHI]
condition = "no_dn"
branch = "no_dn"
dn_reliable_only = false

[experiments.main.FRAIWAN_Extended]
condition = "no_dn"
branch = "no_dn"
dn_reliable_only = false

[experiments.denoising_ablation]
description = "Comparacion emparejada no_dn vs dn, mismo fold, denoising recalibrado con train de ese fold."

[[experiments.denoising_ablation.ICBHI]]
condition = "no_dn"
branch = "no_dn"
dn_reliable_only = false
reused_from_main = true

[[experiments.denoising_ablation.ICBHI]]
condition = "dn"
branch = "dn"
dn_reliable_only = false

[[experiments.denoising_ablation.FRAIWAN_Extended]]
condition = "no_dn"
branch = "no_dn"
dn_reliable_only = false
reused_from_main = true

[[experiments.denoising_ablation.FRAIWAN_Extended]]
condition = "dn"
branch = "dn"
dn_reliable_only = false
